<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>局部风险核查 · 再生塑料配方</title>
<style>
  :root { --ink:#1f2933; --muted:#6b7280; --line:#d8dee6; --ok:#0f7b3d; --bad:#b42318; --warn:#9a6700; --bg:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#0b3d2e; color:#fff; padding:14px 22px; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; font-size:12.5px; opacity:.85; }
  header a { color:#d7f0e4; }
  nav { margin-top:6px; font-size:12.5px; }
  nav a { color:#d7f0e4; margin-right:14px; text-decoration:none; }
  nav a.active { color:#fff; font-weight:700; text-decoration:underline; }
  main { max-width: 1180px; margin: 18px auto 60px; padding: 0 16px; }
  section { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  h3 { font-size:14px; margin:16px 0 8px; }
  textarea { width:100%; min-height:190px; resize:vertical; padding:9px 10px; border:1px solid var(--line);
             border-radius:8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; line-height:1.55; }
  textarea:focus, input[type=number]:focus { outline:2px solid #0b3d2e33; border-color:#0b3d2e; }
  textarea.invalid, input[type=number].invalid { outline:2px solid #b4231855; border-color:var(--bad); }
  input[type=number] { width:110px; padding:7px 8px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; text-align:right; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  .hint { font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.6; }
  .hint b.bad, .sumline b.bad { color:var(--bad); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  button { padding:9px 18px; border-radius:8px; border:1px solid #0b3d2e; background:#0b3d2e; color:#fff; font-size:14px; cursor:pointer; }
  button.ghost { background:#fff; color:#0b3d2e; }
  button:disabled { opacity:.55; cursor:default; }
  #status { min-height: 26px; font-size:13.5px; margin: 12px 0 2px; color:var(--muted); }
  #status .spin { display:inline-block; width:13px; height:13px; border:2px solid #0b3d2e33; border-top-color:#0b3d2e; border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .panel { border-radius:10px; padding:14px 16px; margin-top:10px; font-size:13.5px; display:none; }
  .panel.ok { background:#f7f9fb; border:1px solid var(--line); }
  .panel.invalid { background:#fdf0ee; border:1px solid #f2c7c1; }
  .panel.invalid h3 { color:var(--bad); margin-top:0; }
  .panel.invalid ul { margin:6px 0 0; padding-left:20px; }
  .panel.invalid li { margin:3px 0; }
  .summary { display:flex; flex-wrap:wrap; gap:10px 26px; font-size:13.5px; margin:2px 0 12px; }
  .summary .item b { font-size:15px; }
  .summary .item span { color:var(--muted); font-size:12.5px; display:block; }
  .flagged { color:var(--bad); font-weight:700; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .tag.pause { background:#fde8e4; color:var(--bad); border:1px solid #f2c7c1; }
  .tag.insufficient { background:#eef1f4; color:#4b5563; border:1px solid var(--line); }
  .tablewrap { overflow-x:auto; }
  table { border-collapse: collapse; width:100%; min-width: 980px; }
  th, td { padding:7px 8px; text-align:center; font-size:12.8px; vertical-align:top; }
  th { color:var(--muted); font-weight:600; border-bottom:2px solid var(--line); white-space:nowrap; }
  td { border-bottom:1px solid #eef1f4; }
  tr.pause td { background:#fdf4f2; }
  tr.tree-head td { background:#f2f5f8; color:#374151; font-weight:600; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .bounds { text-align:left; font-size:12.5px; line-height:1.55; }
  .bounds .path { color:var(--muted); font-size:11.8px; margin-top:2px; }
  .num { text-align:right; font-variant-numeric: tabular-nums; }
  .muted { color:var(--muted); }
  .note { font-size:12.5px; color:var(--muted); margin-top:12px; line-height:1.7; }
  code { background:#eef1f4; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>局部风险核查</h1>
  <p id="metaLine">质检模型加载中…</p>
  <nav><a href="/">试配筛选</a><a href="/audit" class="active">局部风险核查</a></nav>
</header>
<main>
  <section>
    <h2>1. 抽检数据与风险上限</h2>
    <label class="field" for="records">
      <span>粘贴抽检记录（每行 4 个整数克数 + 实测合格标签，合计 1000 克；30～300 行）</span>
      <textarea id="records" spellcheck="false" placeholder="示例：&#10;420 280 200 100 合格&#10;250 250 350 150 不合格&#10;…（标签可用 合格/不合格、1/0、是/否）"></textarea>
    </label>
    <div class="row">
      <label class="field" for="riskLimit">
        <span>风险上限（误放行率，0～1 之间）</span>
        <input type="number" id="riskLimit" min="0" max="1" step="0.001" value="0.05">
      </label>
      <div class="hint" id="rowHint"></div>
    </div>
    <div class="btns">
      <button id="auditBtn">开始核查</button>
      <button class="ghost" id="sampleBtn">载入示例抽检数据</button>
    </div>
    <div class="note">
      模型放行判定与原分类器完全一致：克数 ÷ 1000 的 <b>float32</b> 比例送入模型，合格概率 ≥ 0.7 即视为本批记录中的「模型放行」。<br>
      统计时让每条放行记录走完 5 棵树：同一记录在每棵树上命中一个叶，命中多个树叶时各叶分别计数。<br>
      编辑抽检数据或风险上限会立即撤下旧报告，迟到的结算结果不会恢复旧报告。
    </div>
  </section>

  <section>
    <h2>2. 核查结果</h2>
    <div id="status">尚未核查。</div>
    <div class="panel invalid" id="panelInvalid">
      <h3>输入不合法，未生成核查报告</h3>
      <ul id="invalidList"></ul>
    </div>
    <div class="panel ok" id="panelOk">
      <div id="summary"></div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>树 / 叶</th>
              <th>叶路径对应的原料限制（克）</th>
              <th>叶内合格概率</th>
              <th>放行样本数</th>
              <th>其中实测不合格</th>
              <th>实测不合格比例</th>
              <th>95% 同时置信下界</th>
              <th>结论</th>
            </tr>
          </thead>
          <tbody id="leafRows"></tbody>
        </table>
      </div>
      <div class="note" id="methodNote"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const MIN_ROWS = 30, MAX_ROWS = 300;
let meta = null;
let sample = null;

// ---- 结果撤回机制：epoch + AbortController ----
// 任何输入修改都会令 epoch 递增、中止在途请求并立即撤下旧报告；
// 迟到的响应若 epoch 已过期则直接丢弃，绝不恢复旧报告。
let epoch = 0;
let inflight = null;

function countRows() {
  return $("records").value.split("\n").filter(l => l.trim() !== "").length;
}

function updateHint() {
  const n = countRows();
  const okRows = n >= MIN_ROWS && n <= MAX_ROWS;
  const rl = $("riskLimit").value.trim();
  const r = rl === "" ? NaN : Number(rl);
  const okRisk = Number.isFinite(r) && r >= 0 && r <= 1;
  $("records").classList.toggle("invalid", n > 0 && !okRows);
  $("riskLimit").classList.toggle("invalid", !okRisk);
  $("rowHint").innerHTML =
    `当前 <b class="${okRows ? "" : "bad"}">${n}</b> 行（须 ${MIN_ROWS}～${MAX_ROWS} 行）；` +
    (okRisk ? `风险上限 <b>${r}</b>` : '<b class="bad">风险上限须为 0～1 之间的数值</b>');}

function hideReport() {
  $("panelOk").style.display = "none";
  $("panelInvalid").style.display = "none";
}

function invalidate(message) {
  epoch++;
  if (inflight) { inflight.abort(); inflight = null; }
  $("auditBtn").disabled = false;
  hideReport();
  $("status").textContent = message;
  updateHint();
}

function setStatus(text) { $("status").textContent = text; }

async function runAudit() {
  const my = ++epoch;
  if (inflight) inflight.abort();
  inflight = new AbortController();
  const signal = inflight.signal;
  hideReport();
  $("auditBtn").disabled = true;
  $("status").innerHTML = '<span class="spin"></span>核查中…（期间可继续编辑，编辑将作废旧报告）';
  let data;
  try {
    const resp = await fetch("/api/audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ records: $("records").value, risk_limit: $("riskLimit").value }),
      signal,
    });
    data = await resp.json();
  } catch (e) {
    if (my !== epoch) return;              // 已被编辑或更新的请求取代
    $("auditBtn").disabled = false;
    if (e.name === "AbortError") return;   // 编辑触发的中止，invalidate 已处理
    setStatus("请求失败：" + e.message);
    return;
  }
  $("auditBtn").disabled = false;
  if (my !== epoch) return;                // 迟到结果：丢弃，不恢复
  render(data);
}

function fmtPct(x, digits) {
  return (x * 100).toFixed(digits) + "%";
}

function addSummaryItem(parent, label, value, cls) {
  const d = document.createElement("div");
  d.className = "item";
  const b = document.createElement("b");
  b.textContent = value;
  if (cls) b.className = cls;
  const s = document.createElement("span");
  s.textContent = label;
  d.appendChild(b);
  d.appendChild(s);
  parent.appendChild(d);
}

function renderSummary(s) {
  const box = $("summary");
  box.innerHTML = "";
  box.className = "summary";
  addSummaryItem(box, "抽检记录", s.records);
  addSummaryItem(box, "模型放行记录", s.released);
  addSummaryItem(box, "其中实测不合格", s.released_unqualified);
  addSummaryItem(box, "核查叶节点数", s.leaves_total);
  addSummaryItem(box, "建议暂停自动放行的叶", s.leaves_flagged,
                 s.leaves_flagged > 0 ? "flagged" : "");
  addSummaryItem(box, "风险上限", s.risk_limit);
  addSummaryItem(box, "单叶校正显著性水平", s.alpha_corrected.toExponential(3));
  $("methodNote").innerHTML =
    `判定规则：对全部 <b>${s.leaves_total}</b> 个叶做 95% 同时置信核查，每叶采用 Bonferroni 校正` +
    `（α = 0.05 / ${s.leaves_total} = ${s.alpha_corrected.toExponential(3)}）的单侧 Clopper–Pearson 下界；` +
    `仅当某叶的校正后下界 <b>严格大于</b> 所填风险上限 ${s.risk_limit} 时，标为「建议暂停自动放行」；` +
    `其余（包括没有放行记录的叶）均为「证据不足」，不下结论。Bonferroni 对任意相关结构成立，` +
    `同一记录在多棵树上的重复计数不会破坏同时覆盖率。`;
}

function boundsText(bounds) {
  if (!bounds || bounds.length === 0) return "无额外限制（全域）";
  return bounds.map(b => b.min === b.max
    ? `${b.name} = ${b.min}`
    : `${b.name} ${b.min}–${b.max}`).join("；");
}

function renderLeaves(leaves) {
  const tbody = $("leafRows");
  tbody.innerHTML = "";
  let lastTree = null;
  for (const L of leaves) {
    if (L.tree !== lastTree) {
      lastTree = L.tree;
      const tr = document.createElement("tr");
      tr.className = "tree-head";
      const td = document.createElement("td");
      td.colSpan = 8;
      td.textContent = `第 ${L.tree} 棵树`;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    const tr = document.createElement("tr");
    if (L.decision === "pause") tr.className = "pause";

    const cellTree = document.createElement("td");
    cellTree.textContent = `T${L.tree} / #${L.leaf_id}`;

    const cellBounds = document.createElement("td");
    cellBounds.className = "bounds";
    cellBounds.textContent = boundsText(L.bounds);
    const path = document.createElement("div");
    path.className = "path";
    path.textContent = L.path || "（根节点即叶）";
    cellBounds.appendChild(path);

    const cellProb = document.createElement("td");
    cellProb.className = "num";
    cellProb.textContent = fmtPct(L.leaf_probability, 2);

    const cellN = document.createElement("td");
    cellN.className = "num";
    cellN.textContent = L.released;

    const cellK = document.createElement("td");
    cellK.className = "num";
    cellK.textContent = L.released > 0 ? L.released_unqualified : "—";

    const cellRate = document.createElement("td");
    cellRate.className = "num";
    cellRate.textContent = L.failure_rate === null ? "—" : fmtPct(L.failure_rate, 2);

    const cellLower = document.createElement("td");
    cellLower.className = "num";
    cellLower.textContent = L.released > 0 ? fmtPct(L.lower_bound, 2) : "—";

    const cellDecision = document.createElement("td");
    const tag = document.createElement("span");
    if (L.decision === "pause") {
      tag.className = "tag pause";
      tag.textContent = "建议暂停自动放行";
    } else {
      tag.className = "tag insufficient";
      tag.textContent = "证据不足";
    }
    cellDecision.appendChild(tag);

    tr.append(cellTree, cellBounds, cellProb, cellN, cellK, cellRate, cellLower, cellDecision);
    tbody.appendChild(tr);
  }
}

function render(d) {
  if (d.status === "ok") {
    renderSummary(d.summary);
    renderLeaves(d.leaves);
    $("panelOk").style.display = "block";
    setStatus(`核查完成：共 ${d.summary.records} 条抽检记录，其中模型放行 ${d.summary.released} 条。`);
  } else if (d.status === "invalid") {
    const list = $("invalidList");
    list.innerHTML = "";
    for (const msg of (d.errors || [d.reason || "输入不合法"])) {
      const li = document.createElement("li");
      li.textContent = msg;
      list.appendChild(li);
    }
    $("panelInvalid").style.display = "block";
    setStatus("输入不合法，未生成核查报告。请修正后重试。");
  } else {
    setStatus("核查失败：" + (d.reason || "未知错误"));
  }
}

async function loadSample() {
  if (!sample) { setStatus("示例数据尚未就绪，请稍后重试。"); return; }
  $("records").value = sample.text;
  $("riskLimit").value = sample.risk_limit;
  invalidate("已载入示例抽检数据（尚未核查）。请点击「开始核查」生成报告。");
}

async function boot() {
  $("records").addEventListener("input", () => invalidate("抽检数据已修改，旧报告已撤下。请重新核查。"));
  $("riskLimit").addEventListener("input", () => invalidate("风险上限已修改，旧报告已撤下。请重新核查。"));
  $("auditBtn").onclick = runAudit;
  $("sampleBtn").onclick = loadSample;
  updateHint();

  try {
    const [m, s] = await Promise.all([
      fetch("/api/meta").then(r => r.json()),
      fetch("/api/audit/sample").then(r => r.json()),
    ]);
    meta = m;
    sample = s;
    $("metaLine").textContent =
      `质检模型：随机森林 ${m.n_trees} 棵树 / 深度 ≤ ${m.max_depth}，固定种子 ${m.train_seed}；` +
      `放行阈值 合格概率 ≥ ${m.proba_threshold}；总重 ${m.total_grams} 克。`;
  } catch (e) {
    setStatus("初始化失败：" + e.message);
  }
}
boot().catch(e => setStatus("初始化失败：" + e.message));
</script>
</body>
</html>
